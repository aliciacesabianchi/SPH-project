# Sources the daily refresh checks for new / changed / cancelled offers.
# method:
#   jsonld     – page embeds schema.org Event JSON-LD → parsed automatically by tools/qj.py fetch
#   ical       – .ics feed → parsed automatically
#   json_api   – JSON endpoint → parsed automatically (adapter in tools/adapters.py)
#   csv        – open-data CSV (e.g. location lists)
#   html_watch – only detects that the page changed (hash) and flags it for review
#   claude     – read and interpreted by the daily Claude task (automation/daily-refresh.md)
# NOTE: none of these could be fetched from the build container on 2026-11-18 (network policy);
#       methods other than `claude` are best guesses until the first successful run.

items:
