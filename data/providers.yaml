# Providers = organisations that run offers for families (who).
# Locations (where) live in locations.yaml, offers/events (what & when) in events/*.yaml.
#
# `defaults` is merged into every item that does not set the key itself.
# verification.status:
#   confirmed  = checked on the provider's own page
#   reported   = seen in a search result / third-party listing
#   unverified = incomplete or from memory: a human (or the daily Claude task) must check it

defaults:
  verification: { status: reported, checked_at: 2026-11-18, method: web_search }

