  # ---------------------------------------------------------------- Stadt Zürich (Soziokultur, Familienberatung, Quartiertreffs)
  - id: stadt-zuerich-soziokultur-kinder
    name: Stadt Zürich – Soziokultur Kinder (Familienfreizeit)
    type: stadt
    website: https://www.stadt-zuerich.ch/de/stadtleben/zusammenleben/in-den-quartieren/familienfreizeit.html
    events_url: https://www.stadt-zuerich.ch/de/stadtleben/zusammenleben/in-den-quartieren/familienfreizeit.html
    description: Freiwillige, kostenlose Angebote ohne Anmeldung für Kleinkinder mit Familien und Kinder bis 6. Klasse. Pro Kreis eine Seite "Freizeit-Angebote für Kleinkinder" (…/familienfreizeit/kreisN/kleinkinder.html).
    locations: [familientreff-entlisberg, familientreff-hard, spielbaracke, quartierzentrum-baeckeranlage]
  - id: stadt-zuerich-familienberatung
    name: Familienberatung der Stadt Zürich (ehem. Mütter- und Väterberatung)
    type: stadt
    website: https://www.stadt-zuerich.ch/de/lebenslagen/jugend-und-familie/familien/familienberatung.html
    events_url: https://www.stadt-zuerich.ch/de/lebenslagen/jugend-und-familie/fruehe-kindheit/familienberatung/baby-kleinkind/angebote.html
    description: Kostenlose, mehrsprachige Beratung für Familien mit Kindern 0–18, 15 Treffpunkte in der Stadt. Seit August 2025 neuer Name. Gruppenangebote wie Begleiteter Bewegungsraum, PEKiP, Child'Space.
  - id: stadt-zuerich-quartiertreffs
    name: Stadt Zürich – Quartiertreffs und Quartierräume
    type: quartiertreff
    website: https://www.stadt-zuerich.ch/quartierraeume
    description: Quartiertreffs, Quartierhäuser und Quartierzentren der Stadt. Vollständige Standortliste im Open-Data-Datensatz "geo_quartiertreff" (siehe sources.yaml).
    locations: [quartierhaus-kreis-6, quartierzentrum-schuetze, quartierzentrum-baeckeranlage, quartiertreff-enge, quartiertreff-hirslanden, quartiertreff-zehntenhaus, quartiertreff-waldgarten, kulturhaus-helferei]
  - id: mkz
    name: Musikschule Konservatorium Zürich (MKZ)
    type: musik
    website: https://www.stadt-zuerich.ch/mkz/de/angebot/angebot-finden/vorschulunterricht.html
    description: Städtische Musikschule. Vorschulunterricht inkl. Eltern-Kind-Singen und Musizieren (1½–4 Jahre). Anmeldeschluss meist 31. Mai / 15. Dezember.
  - id: pbz
    name: PBZ Pestalozzi-Bibliothek Zürich
    type: bibliothek
    website: https://www.pbz.ch/
    events_url: https://www.pbz.ch/
    description: Öffentliche Bibliothek der Stadt Zürich mit 14 Standorten. KinderTREFF-Reihe, Buchstart (Bücherkiste, Ryte ryte Rössli), Family Literacy in vielen Sprachen.
